<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="application-name" content="Papo" />
		<meta name="theme-color" content="#0b6fd8" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#082b52" media="(prefers-color-scheme: dark)" />

		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
		<link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
		<link rel="manifest" href="/site.webmanifest" />

		%sveltekit.head%
		<script>
			(function () {
				var t = null;
				try {
					t = localStorage.getItem('papo:theme');
				} catch (e) {}
				if (t !== 'light' && t !== 'dark') {
					t =
						window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				}
				document.documentElement.setAttribute('data-theme', t);
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		%sveltekit.body%
	</body>
</html>
